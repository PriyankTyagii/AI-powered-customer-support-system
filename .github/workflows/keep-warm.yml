# Pings the API health endpoint so the free Render instance doesn't spin down.
# Set the API_HEALTH_URL repository secret to https://<your-api>.onrender.com/api/health
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ secrets.API_HEALTH_URL }}" ]; then
            echo "API_HEALTH_URL secret not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 30 "${{ secrets.API_HEALTH_URL }}" || echo "Ping failed (instance may be waking)."
