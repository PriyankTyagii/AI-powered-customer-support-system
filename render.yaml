# Render Blueprint for the API. Import via the Render dashboard → New → Blueprint.
# The web app (apps/web) is deployed separately on Vercel.
services:
  - type: web
    name: support-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets — set these in the Render dashboard (never commit them).
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Comma-separated allow-list of web origins, e.g. https://your-app.vercel.app
      - key: CORS_ORIGIN
        sync: false
